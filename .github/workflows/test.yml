name: Lint and Test

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        python-version: "3.13"

    - name: Run Linters
      run: uv run ruff check src

    - name: Run Tests
      run: PYTHONPATH=. uv run pytest tests
