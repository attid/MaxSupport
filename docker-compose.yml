services:
  bot:
    image: ghcr.io/attid/maxsupport:latest
    restart: always
    volumes:
      - data:/app/data
    environment:
      TELEGRAM_BOT_TOKEN: change_me
      MAX_BOT_TOKEN: change_me
      ASSISTANTS_CHAT_ID: -1000000000000
      DB_URL: sqlite+aiosqlite:////app/data/data.db
      TELEGRAM_API_URL: https://api.telegram.org
      LOG_FORMAT: json

volumes:
  data:
