services:
  bot:
    image: ghcr.io/attid/maxsupport:latest
    restart: always
    volumes:
      - data:/app/data
    # Переменные окружения передаются через docker run -e или environment: секцию в compose
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
      ASSISTANTS_CHAT_ID: ${ASSISTANTS_CHAT_ID}
      DB_URL: sqlite+aiosqlite:////app/data/data.db

volumes:
  data:
